[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "power_style"
version = "0.1.0"
description = "A generic, multi-tier memory and rule scheduling framework inspired by PowerMem."
authors = [{ name = "wayyoungboy", email = "wayyoungboy@github.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
